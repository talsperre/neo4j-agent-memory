[project]
name = "neo4j-agent-memory"
version = "0.1.0"
description = "Bi-temporal knowledge-graph memory for AI agents (Neo4j + structured extraction + agentic retrieval)."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "talsperre"}]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "neo4j>=5.20",
    "mcp>=1.0",
    "pydantic>=2.5",
]

[project.urls]
Repository = "https://github.com/talsperre/neo4j-agent-memory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neo4j_memory"]
